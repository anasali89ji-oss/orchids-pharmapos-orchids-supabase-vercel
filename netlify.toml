# Netlify configuration for PharmaPOS - Next.js Application
# This configuration replaces vercel.json for Netlify deployment

[build]
  # Build command - Use npm, yarn, or bun depending on preference
  # For Netlify, we recommend npm for best compatibility
  command = "npm run build"
  
  # Directory to publish (default is root)
  publish = ".next"

  # Environment variables for build
  [build.environment]
    NODE_VERSION = "20"
    # Skip optional dependencies to speed up build
    NPM_FLAGS = "--legacy-peer-deps"
    # Use TypeScript installed in node_modules
    NODE_OPTIONS = "--max-old-space-size=4096"

# Redirect & Rewrite rules
[[redirects]]
  from = "/app/*"
  to = "/app/:splat"
  status = 200

[[redirects]]
  from = "/superadmin/*"
  to = "/superadmin/:splat"
  status = 200

# Next.js middleware support
[[redirects]]
  from = "/_next/static/*"
  to = "/_next/static/:splat"
  status = 200

# API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Fallback for clean URLs
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers configuration - Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-DNS-Prefetch-Control = "on"

# Cache headers for static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.{jpg,jpeg,png,gif,ico,svg,webp,avif}"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API CORS headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Credentials = "true"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Edge functions (for Stripe routes)
[[edge_functions]]
  path = "/api/stripe/*"
  function = "stripe-handler"

# Background function for long-running backups
[[functions]]
  directory = "netlify/functions"

# Function-specific configuration
[functions]
  # Default configuration for all functions
  node_bundler = "esbuild"
  included_files = ["src/**", "public/**"]

# Backup function (longer timeout)
[[functions]]
  directory = "netlify/functions/api-backup-daily"
  timeout = 180

# Cron jobs (Netlify Scheduled Functions)
[scheduled]
  # Daily backup at 2 AM UTC
  [[scheduled.crons]]
    cron = "0 2 * * *"
    path = "/api/backup/daily"
  
  # Session cleanup at 3 AM UTC
  [[scheduled.crons]]
    cron = "0 3 * * *"
    path = "/api/cron/session-cleanup"
  
  # Connection ping every 15 minutes
  [[scheduled.crons]]
    cron = "*/15 * * * *"
    path = "/api/cron/connection-ping"

# Dev server configuration
[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  publish = ".next"
  # Auto-open browser
  autoLaunch = false

# Production deployment context
[context.production]
  command = "npm run build"
  
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Netlify Plugins - Essential for Next.js on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

  # Plugin configuration
[plugins.inputs]
  # Enable Next.js features
  debug = false

# Environment variables (these should also be set in Netlify Dashboard)
# Uncomment and fill in values, or set via Netlify UI
# [context.production.environment]
#   NEXT_PUBLIC_SUPABASE_URL = "https://your-project.supabase.co"
#   NEXT_PUBLIC_SUPABASE_ANON_KEY = "your-anon-key"
#   SUPABASE_SERVICE_ROLE_KEY = "your-service-role-key"
#   STRIPE_SECRET_KEY = "sk_test_..."
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = "pk_test_..."
#   STRIPE_WEBHOOK_SECRET = "whsec_..."
#   CRON_SECRET = "your-cron-secret"
